name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Isort  
        uses: isort/isort-action@v1
        with:
          configuration: "--check-only --diff --profile=black"

      - name: Run black
        uses: psf/black@stable
        with:
          options: "--exclude src/auth/ifrastructure/alembic/versions/"

      - name: Run mypy
        uses: sasanquaneuf/mypy-github-action@releases/v1
        with:
          checkName: 'mypy'
       
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"

    - name: Wait for PostgreSQL
      run: |
        timeout 60 bash -c 'until nc -z postgres 5432; do sleep 2; done'

    - name: Run migrations
      run: |
        docker compose exec auth poetry run alembic -c src/auth/alembic.ini upgrade head
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_pass@postgres:5432/test_db

    - name: Run tests
      run: |
        docker compose exec auth poetry run pytest src/tests -v --cov=src --cov-report=xml
      env:
        DATABASE_URL: postgresql+asyncpg://test_user:test_pass@postgres:5432/test_db

    - name: Install diff-cover
      run: |
        pip install diff-cover

    - name: Run diff-cover
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }}
        else
          diff-cover coverage.xml --compare-branch=origin/main
        fi