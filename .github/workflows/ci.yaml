name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Isort  
        uses: isort/isort-action@v1
        with:
          configuration: "--check-only --diff --profile=black"

      - name: Run black
        uses: psf/black@stable
        with:
          options: "--exclude src/auth/ifrastructure/alembic/versions/"

      - name: Run mypy
        uses: sasanquaneuf/mypy-github-action@releases/v1
        with:
          checkName: 'mypy'
       
  ttest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.12"
    
    - name: Run tests
      run: |
        poetry install
        poetry run pytest --cov=src --cov-report=xml:coverage.xml
    
    - name: Run diff-cover
      run: |
        git fetch origin main
        poetry run diff-cover coverage.xml --compare-branch origin/main --html-report report.html
        poetry run diff-cover coverage.xml --compare-branch origin/main --fail-under=90